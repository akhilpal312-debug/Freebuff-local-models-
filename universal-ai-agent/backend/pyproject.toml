[project]
name = "universal-ai-agent-backend"
version = "0.1.0"
description = "Backend for Universal AI Agent: multi-model gateway, agent runtime, research, coding and knowledge services."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "sqlalchemy[asyncio]>=2.0.30,<3.0",
  "asyncpg>=0.29,<1.0",
  "aiosqlite>=0.20,<1.0",
  "pyjwt[crypto]>=2.8,<3.0",
  "cryptography>=42,<46",
  "httpx>=0.27,<1.0",
  "websockets>=12,<16",
  "beautifulsoup4>=4.12,<5.0",
  "python-multipart>=0.0.9,<1.0",
  "orjson>=3.10,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "anyio>=4.3,<5.0",
  "ruff>=0.5",
]
redis = ["redis>=5.0,<6.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
